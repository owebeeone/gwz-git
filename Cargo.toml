[package]
name = "gwz-git"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-only"
publish = false
repository = "https://github.com/owebeeone/gwz-git"
description = "Single-repository Git behavior for GWZ"

[workspace]

[features]
default = []
# Test facilities that production consumers must not have: `RoutePolicy::CLI_ONLY` and
# `Services::with_policy` (force the Git CLI route to compare it with the native one).
# gwz-core enables it in [dev-dependencies] only.
test-support = []

[dependencies]
cfg-if = "1"
git2 = { package = "gwz-git2", path = "../git2-rs", version = "=0.21.0", default-features = false, features = ["unstable-sha256", "vendored-libgit2"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
# native_commit's Windows-only test spells a path by its short names (GetShortPathNameW).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
